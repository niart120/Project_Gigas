    <rect width="680" height="565" rx="5" class="frame"/><text x="15" y="24" class="small">GIGAS　　ファイル　　接続　　設定</text><path d="M0 36H680" stroke="#d4d9df"/>
    <rect x="0" y="36" width="315" height="529" class="pane"/>
